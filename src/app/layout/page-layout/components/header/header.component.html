<div class="header flex items-center justify-between p-4">
  <img src="/assets/images/logo.svg" alt="Logo" class="h-12 ml-4" />
  <mat-stepper
    class="stepper pointer-events-none"
    linear
    #stepper
  >
    <mat-step>
      <ng-template matStepLabel>{{ 'STEPPER.STEP_1' | translate }}</ng-template>
    </mat-step>
    <mat-step>
      <ng-template matStepLabel>{{ 'STEPPER.STEP_2' | translate }}</ng-template>
    </mat-step>
    <mat-step>
      <ng-template matStepLabel>{{ 'STEPPER.STEP_3' | translate }}</ng-template>
    </mat-step>
  </mat-stepper>

  <div class="flex lang">
    <div class="flex gap-2 items-center justify-center mr-8">
      @for(lang of langualges; track $index) {
      <span
        tabindex="0"
        class="cursor-pointer uppercase lang"
        [class.active]="lang === translate.activeLang()"
        (click)="translate.switchLanguage(lang)"
        (keydown.enter)="translate.switchLanguage(lang)"
        >{{ lang }}
      </span>
      }
    </div>

    <button mat-icon-button (click)="reservation.cancelReservation()">
      <mat-icon>close</mat-icon>
    </button>
  </div>
</div>
